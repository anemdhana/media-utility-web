# ─── Pipeline Control ────────────────────────────────────────────────────────
# Which steps to run. Comma-separated. Allowed values: 1, 2, 3
# 1 = transcribe  (audio  -> timestamped .txt)
# 2 = to-markdown (txt    -> cleaned .md)
# 3 = to-pdf      (md     -> Kindle .pdf)
# Examples:
#   steps=1,2,3   run all three in sequence
#   steps=1       only transcribe
#   steps=2,3     skip transcription, process existing txt
steps=1

# ─── Input / Output ───────────────────────────────────────────────────────────
# Path to input audio file (for step 1), OR .txt file (for step 2/3 without step 1)
input=C:\Users\dhana\GitHub\media-utility-web\conscious_relationships_drlakshmi_newton.captions.txt

# Optional: output folder. Default = same folder as input file
output_dir=

# Optional: base name for all generated files (no extension).
# Default = stem of input file
basename=

# ─── Step 1 – Transcription (faster-whisper) ─────────────────────────────────
# Whisper model size: tiny | base | small | medium | large-v3
model=medium

# Language code (e.g. te, en, hi). Use "auto" for automatic detection
language=en

# Fallback speaker label when diarization is disabled
speaker=Speaker 1

# Enable speaker diarization via pyannote (true / false)
diarize=false

# HuggingFace token – required only when diarize=true
hf_token=
