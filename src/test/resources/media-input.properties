# Unified media input configuration for BDD scenarios.
#
# Resolution order when a scenario key is used:
# 1) unscoped legacy keys (feature, videoId, ...)
# 2) default.*
# 3) common.*
# 4) scenario.<scenarioKey>.*
#
# Keep shared defaults here to avoid duplication.
default.quality=COMPACT_SIZE_SPEECH
default.outputFormat=m4a

# Common values used by multiple scenarios.
common.speaker=Shreans Daga

# Scenario: single_video
# Use for downloading one or more explicit YouTube video ids.
scenario.single_video.feature=youtube
# Single id, or comma-separated ids (whitespace around commas is fine).
scenario.single_video.videoId=Py8Z7D15JYo
scenario.single_video.label=swasa_maha_vidya_telugu

# Scenario: playlist
# Use for downloading an entire playlist.
scenario.playlist.feature=youtube
scenario.playlist.quality=COMPACT_MUSIC_INSTRUMENTAL
scenario.playlist.playlistId=PLcGbvQVcODoNcwv9TDFjszyB0EhRZeQxB
scenario.playlist.label=Focus_With_Indian_Instrumentals

# Scenario: thumbnail
# Use for high quality thumbnail extraction.
scenario.thumbnail.feature=youtube_thumbnail
scenario.thumbnail.videoId=iqBXlxShSdI

# Scenario: extract_split
# Use for clipped audio extraction from a YouTube source.
scenario.extract_split.feature=youtube_extract_split
scenario.extract_split.videoId=TsAu5JD6aEo
scenario.extract_split.startTime=01:18:15
scenario.extract_split.endTime=02:50:29
scenario.extract_split.label=soul_cast_shreans

# Scenario: whatsapp_compact_video
# Use for compact video splitting suitable for WhatsApp sharing.
#
# Input file resolution order:
#   1. inputFile  — absolute path or ${user.home}/relative/path
#   2. videoId    — matches a file in mediafiles_dir whose name contains the id
#   3. (omitted)  — picks the first available video file from mediafiles_dir
#
# Examples:
scenario.whatsapp_compact_video.inputFile=C:/Users/dhana/Realme_8i_backup/DCIM/Camera/VID20211203165017-whatsapp_compact_video-video-props-00-00-10-to-00-00-40.mp4
#   scenario.whatsapp_compact_video.videoId=To0lu_BrXTk
scenario.whatsapp_compact_video.feature=media_split
scenario.whatsapp_compact_video.mediaType=video
scenario.whatsapp_compact_video.startTime=00:00:10
scenario.whatsapp_compact_video.endTime=00:00:40
scenario.whatsapp_compact_video.quality=WHATSAPP_COMPACT_VIDEO
scenario.whatsapp_compact_video.outputFormat=mp4

